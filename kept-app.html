<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kept · Prototype by Amulya</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ground:#faf8f5;--surface:#ffffff;--sunk:#f2efea;--line:#e3ded6;--line-strong:#8f887d;
  --ink:#1e1d1a;--muted:#625c52;
  --teal:#0f5f5c;--on-teal:#ffffff;--teal-tint:#e3f0ee;--teal-soft:#cfe6e2;--avatar-ink:#0f5f5c;
  --violet:#6a4bd8;--violet-tint:#f1edfd;
  --amber:#7a4e00;--amber-tint:#fdf1d6;--amber-line:#c98a12;
  --green:#1c6b3a;--green-tint:#e2f3e7;--red:#a3241f;--red-tint:#fbe6e3;
  --shadow:0 4px 16px rgba(30,29,26,.12);
  --font:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#161614;--surface:#1f1e1b;--sunk:#12110f;--line:#34322d;--line-strong:#8a8478;
  --ink:#f2efe9;--muted:#aba498;
  --teal:#4fb3ac;--on-teal:#12110f;--teal-tint:#183331;--teal-soft:#2c5f5b;--avatar-ink:#f2efe9;
  --violet:#a897f2;--violet-tint:#241f3a;
  --amber:#f0c46a;--amber-tint:#3a2c10;--amber-line:#b9861e;
  --green:#7fd39b;--green-tint:#16301f;--red:#f49a92;--red-tint:#3a1a17;
  --shadow:0 4px 16px rgba(0,0,0,.5);color-scheme:dark}}
:root[data-theme="dark"]{
  --ground:#161614;--surface:#1f1e1b;--sunk:#12110f;--line:#34322d;--line-strong:#8a8478;
  --ink:#f2efe9;--muted:#aba498;
  --teal:#4fb3ac;--on-teal:#12110f;--teal-tint:#183331;--teal-soft:#2c5f5b;--avatar-ink:#f2efe9;
  --violet:#a897f2;--violet-tint:#241f3a;
  --amber:#f0c46a;--amber-tint:#3a2c10;--amber-line:#b9861e;
  --green:#7fd39b;--green-tint:#16301f;--red:#f49a92;--red-tint:#3a1a17;
  --shadow:0 4px 16px rgba(0,0,0,.5);color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font:14px/22px var(--font);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
a{color:var(--teal)}
h1,h2,h3{margin:0;text-wrap:balance}

.demo{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding:8px 16px;padding-top:calc(8px + env(safe-area-inset-top,0px));background:var(--ink);color:var(--ground);font-size:13px}
.demo a{color:var(--ground);font-weight:600;display:inline-flex;align-items:center;min-height:40px}
.demo button{background:transparent;border:1px solid currentColor;color:var(--ground);border-radius:999px;padding:0 14px;font-size:13px;min-height:36px}
.demo .sp{flex:1}

.app{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:calc(100vh - 56px);min-height:calc(100dvh - 56px)}
.nav{border-right:1px solid var(--line);padding:24px 16px;display:flex;flex-direction:column;gap:4px}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px 20px;font-size:22px;font-weight:600;letter-spacing:-.02em}
.nav button{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border-radius:8px;border:none;background:transparent;text-align:left;min-height:44px}
.nav button[aria-current="page"]{background:var(--teal-tint);color:var(--teal);font-weight:600}
.nav button:hover:not([aria-current="page"]){background:var(--sunk)}
.nav .count{margin-left:auto;background:var(--teal);color:var(--on-teal);font-size:12px;line-height:16px;padding:2px 8px;border-radius:999px;font-weight:600}
.nav .grow{flex:1}
.profile{display:flex;align-items:center;gap:10px;padding:12px 8px 0;border-top:1px solid var(--line)}
.avatar{flex:none;width:36px;height:36px;border-radius:999px;background:var(--sunk);color:var(--muted);display:flex;align-items:center;justify-content:center;font-weight:600}
.avatar.on{background:var(--teal-soft);color:var(--avatar-ink)}
.small{font-size:12px;line-height:18px;color:var(--muted)}

.main{display:flex;flex-direction:column;min-width:0;padding:20px 24px 24px;gap:16px}
.head{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.head h1{font-size:20px;line-height:28px;font-weight:600}
.head .grow{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:8px;border:1px solid transparent;font-weight:600;background:transparent}
.btn.primary{background:var(--teal);color:var(--on-teal)}
.btn.secondary{background:var(--surface);border-color:var(--line-strong);font-weight:500}
.btn.quiet{font-weight:500}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px}
.btn[disabled]{background:var(--sunk);color:var(--muted);border-color:var(--line);cursor:not-allowed}
.sale{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;padding:8px 16px;background:var(--amber-tint);border:1px solid var(--amber-line);border-radius:8px;color:var(--amber);font-weight:600}
.sale span{margin-left:auto;font-weight:400;color:var(--ink)}
.chip{display:inline-flex;align-items:center;font-size:12px;line-height:16px;font-weight:600;letter-spacing:.02em;padding:3px 10px;border-radius:999px;white-space:nowrap}
.chip.paid{background:var(--green-tint);color:var(--green)}
.chip.unpaid{background:var(--red-tint);color:var(--red)}
.chip.check{background:var(--amber-tint);color:var(--amber)}
.chip.ai{background:var(--violet-tint);color:var(--violet)}
.chip.kept{background:var(--teal-tint);color:var(--teal)}
.chip.neutral{background:var(--sunk);color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}

.inbox{display:grid;grid-template-columns:300px minmax(0,1fr) 380px;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;flex:1;min-height:600px}
.list{border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0}
.convo{display:flex;gap:12px;padding:14px 16px;border:none;border-bottom:1px solid var(--line);background:transparent;text-align:left;width:100%}
.convo[aria-current="true"]{background:var(--teal-tint)}
.convo:hover:not([aria-current="true"]){background:var(--sunk)}
.convo .body{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.convo .row{display:flex;justify-content:space-between;gap:8px}
.convo .prev{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat{display:flex;flex-direction:column;min-width:0;background:var(--ground)}
.chat .who{display:flex;align-items:center;gap:12px;padding:14px 20px;background:var(--surface);border-bottom:1px solid var(--line)}
.msgs{flex:1;padding:20px;display:flex;flex-direction:column;gap:12px;overflow-y:auto;max-height:560px}
.msg{max-width:78%;padding:10px 14px;border-radius:14px 14px 14px 4px;background:var(--surface);border:1px solid var(--line);align-self:flex-start;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;border-radius:14px 14px 4px 14px;background:var(--teal-tint);border-color:transparent}
.msg.sys{align-self:center;background:transparent;border:1px dashed var(--line-strong);border-radius:999px;font-size:12px;color:var(--muted);padding:4px 12px}
.msg time{display:block;font-size:11px;line-height:16px;color:var(--muted);margin-top:4px}
.hl-ai{background:var(--violet-tint);border-bottom:2px solid var(--violet);padding:0 2px}
.hl-check{background:var(--amber-tint);border-bottom:2px solid var(--amber-line);padding:0 2px}
.typing{align-self:flex-start;font-size:12px;color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;justify-content:center;gap:16px;font-size:12px;color:var(--muted);padding:0 20px 8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.compose{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;padding:14px 20px;background:var(--surface);border-top:1px solid var(--line)}
.compose .field{flex:1 1 200px;display:flex;flex-direction:column;gap:4px;min-width:0}
.compose label{font-size:12px;color:var(--muted)}
.compose input{padding:10px 12px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);min-height:44px;width:100%}
.side{border-left:1px solid var(--line);padding:16px;background:var(--surface);min-width:0}
.card{border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:4px;transition:background .25s,border-color .25s}
.card.draft{border:1.5px dashed var(--violet)}
.card.kept{border:1.5px solid var(--teal);background:var(--teal-tint)}
.card .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.card h2{font-size:16px;line-height:24px;font-weight:600}
.f{display:grid;grid-template-columns:84px minmax(0,1fr);gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.f:last-of-type{border-bottom:none}
.f .k{font-size:12px;color:var(--muted)}
.f.check{background:var(--amber-tint);border:1px solid var(--amber-line);border-radius:6px;padding:10px;margin:4px -10px}
.f.check .k{color:var(--amber);font-weight:600}
.f.bad{background:var(--red-tint);border:1px solid var(--red);border-radius:6px;padding:10px;margin:4px -10px}
.f.bad .k{color:var(--red);font-weight:600}
.f .v{display:flex;flex-direction:column;gap:6px;align-items:flex-start;min-width:0}
.hint{font-size:12px;line-height:18px;color:var(--amber)}
.hint.bad{color:var(--red)}
.sizes{display:flex;gap:6px}
.sizes button{min-width:44px;min-height:36px;border-radius:6px;border:1px solid var(--line-strong);background:var(--surface);font-weight:500}
.sizes button[aria-pressed="true"]{border:1.5px solid var(--ink);font-weight:600}
.foot{display:flex;flex-direction:column;gap:8px;padding-top:12px;margin-top:8px;border-top:1px solid var(--line)}
.foot .row{display:flex;flex-wrap:wrap;gap:8px}
.foot .row .btn.primary{flex:1}
.confirm{background:var(--sunk);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:8px}
.tip{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding:10px 16px;border-radius:8px;background:var(--surface);border:1px solid var(--line)}
.tip ol{display:flex;flex-wrap:wrap;gap:4px 20px;margin:0;padding:0;list-style:none;counter-reset:t}
.tip li{counter-increment:t}
.tip li::before{content:counter(t);display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:999px;background:var(--teal);color:var(--on-teal);font-size:12px;font-weight:600;margin-right:6px}
.tip .x{margin-left:auto}
.addr{font-size:15px;line-height:22px;font-weight:600}
.pay{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:10px 12px;border-radius:8px;font-weight:600;margin:8px 0 4px}
.pay.no{background:var(--red-tint);color:var(--red);border:1px solid var(--red)}
.pay.yes{background:var(--green-tint);color:var(--green);border:1px solid var(--green)}
.pay small{display:block;font-weight:400;font-size:12px;line-height:18px;color:var(--ink)}
.pay .big{font-size:18px;line-height:24px}
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;margin:4px 0 8px;padding:0;list-style:none}
.steps li{display:flex;flex-direction:column;gap:6px;font-size:12px;line-height:16px;color:var(--muted)}
.steps li::before{content:"";height:6px;border-radius:999px;background:var(--line)}
.steps li.done{color:var(--ink)}
.steps li.done::before{background:var(--teal)}
.steps li.now{color:var(--ink);font-weight:600}
.steps li.now::before{background:var(--amber-line)}
.empty{border:1.5px dashed var(--line-strong);border-radius:8px;padding:20px 16px;text-align:center;color:var(--muted);font-size:13px}

.board{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;align-items:start}
.col{background:var(--sunk);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.col h2{font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px}
.col .ch{display:flex;justify-content:space-between;align-items:center}
.dot{width:8px;height:8px;border-radius:999px;display:inline-block}
.oc{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.oc.new{border:1.5px solid var(--teal);animation:pop .6s ease}
.oc .meta{display:flex;justify-content:space-between;gap:8px;font-size:12px;line-height:18px;color:var(--muted)}
.oc .note{font-size:12px;line-height:18px;color:var(--muted);background:var(--sunk);padding:4px 8px;border-radius:6px}
.oc.done{background:var(--ground);color:var(--muted)}
@keyframes pop{from{transform:scale(.97);opacity:.4}to{transform:none;opacity:1}}

.stock{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;align-items:start}
.tablewrap{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:560px}
th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:12px 16px;background:var(--ground);border-bottom:1px solid var(--line)}
td{padding:14px 16px;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:none}
.num{text-align:right}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:16px}
.bar{height:8px;border-radius:999px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:8px;border-radius:999px}
.seg{display:inline-flex;padding:3px;background:var(--sunk);border-radius:999px}
.seg button{border:none;border-radius:999px;padding:6px 16px;background:transparent;color:var(--muted);font-size:13px;min-height:32px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600}

.phone-wrap{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start}
.phone{width:min(390px,100%);border:1px solid var(--line);border-radius:28px;background:var(--ground);padding:24px 16px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.phone h2{font-size:26px;line-height:32px;font-weight:600}
.pc{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px;font-size:16px;line-height:24px}
.pc .t{font-size:18px;font-weight:600}
.pc .btn{min-height:52px;border-radius:10px;font-size:16px}
.ok{color:var(--green);font-weight:600;font-size:14px}
.wait{font-size:14px;line-height:20px;padding:8px 12px;border-radius:8px;background:var(--amber-tint);border:1px solid var(--amber-line);color:var(--amber)}
.explain{flex:1 1 260px;max-width:420px;display:flex;flex-direction:column;gap:8px;color:var(--muted)}
.explain h2{color:var(--ink);font-size:16px}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--ground);padding:10px 16px;border-radius:8px;box-shadow:var(--shadow);font-weight:500;max-width:calc(100% - 32px);z-index:5}

@media (max-width:1180px){
  .inbox{grid-template-columns:260px minmax(0,1fr)}
  .side{grid-column:1/-1;border-left:none;border-top:1px solid var(--line)}
  .board{grid-template-columns:repeat(3,minmax(0,1fr))}
  .stock{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .nav{flex-direction:row;flex-wrap:wrap;align-items:center;border-right:none;border-bottom:1px solid var(--line);padding:12px 16px;gap:4px}
  .brand{padding:0 8px 0 0}
  .nav button{width:auto}
  .nav .grow,.nav .profile{display:none}
  .main{padding:16px}
  .inbox{grid-template-columns:minmax(0,1fr)}
  .list{border-right:none;border-bottom:1px solid var(--line)}
  .board{grid-template-columns:minmax(0,1fr)}
  .msg{max-width:90%}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="demo" role="note">
  <strong>Interactive prototype</strong><span>Sample data. Try approving Riya's order, then mark it paid and pack it.</span>
  <span class="sp"></span>
  <button type="button" data-act="reset">Reset demo</button>
  <a href="kept.html">Back to case study</a>
</div>
<div id="app"></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script>
const ICON = {
  inbox:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>',
  orders:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 3h6v3H9zM9 11h6M9 15h4"/></svg>',
  stock:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 8 12 3 3 8v8l9 5 9-5V8z"/><path d="M3 8l9 5 9-5M12 13v8"/></svg>',
  helper:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/></svg>',
  logo:'<svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><rect x="1" y="1" width="24" height="24" rx="6" fill="var(--teal)"/><rect x="6" y="8" width="14" height="4" rx="2" fill="var(--teal-soft)"/><rect x="6" y="15" width="9" height="4" rx="2" fill="var(--teal-soft)"/></svg>'
};
const CH = {wa:'WhatsApp', ig:'Instagram', fb:'Facebook'};

function fresh(){
  return {
    view:'inbox', sale:true, tip:true, sel:'riya', confirmPay:null, newOrder:null, typing:null, nextId:1048, compose:{}, stockMode:'units',
    products:{
      kS:{name:'Navy linen kurti',v:'S',stock:2}, kM:{name:'Navy linen kurti',v:'M',stock:3}, kL:{name:'Navy linen kurti',v:'L',stock:1},
      dS:{name:'Mustard wrap dress',v:'S',stock:4}, dM:{name:'Mustard wrap dress',v:'M',stock:2},
      fl:{name:'Floral cotton set',v:'Free size',stock:6}, hp:{name:'Silver hoop earrings',v:'One size',stock:0}
    },
    orders:[
      {id:1047, who:'@asha.styles', ch:'ig', p:'dM', qty:1, status:'unpaid', addr:true, conv:'asha', age:'25 min'},
      {id:1046, who:'Neha K.', ch:'wa', p:'dM', qty:1, status:'paid', addr:true, note:'Gift wrap, no price tag', conv:'neha'},
      {id:1045, who:'Farah S.', ch:'fb', p:'fl', qty:2, status:'paid', addr:false, conv:'farah'},
      {id:1044, who:'@meera.j', ch:'ig', p:'fl', qty:1, status:'unpaid', addr:true, conv:'meera', age:'1 h'},
      {id:1043, who:'Leela T.', ch:'wa', p:'kS', qty:1, status:'paid', addr:true},
      {id:1042, who:'Tanvi R.', ch:'wa', p:'kL', qty:1, status:'unpaid', addr:true, age:'2 h'},
      {id:1041, who:'Tara P.', ch:'wa', p:'dS', qty:1, status:'packed', addr:true},
      {id:1040, who:'Sam R.', ch:'ig', p:'hp', qty:1, status:'packed', addr:true},
      {id:1036, who:'Kiran D.', ch:'wa', p:'dS', qty:1, status:'delivered', addr:true},
      {id:1035, who:'@nila.co', ch:'ig', p:'fl', qty:1, status:'delivered', addr:true}
    ],
    convos:[
      {id:'riya', who:'Riya M.', ch:'wa', merged:true, time:'2 min', msgs:[
        {f:'b', t:['Hi! Is the ',{h:'ai',t:'navy linen kurti'},' from today’s post still available?'], at:'10:02'},
        {f:'s', t:['Yes it is! Which size do you need?'], at:'10:03'},

let S = fresh();
let toastTimer = null;

const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const held = p => S.orders.filter(o => o.p === p && o.status === 'unpaid').reduce((a,o) => a + o.qty, 0);
const avail = p => S.products[p].stock - held(p);
const order = id => S.orders.find(o => o.id === id);
const convo = id => S.convos.find(c => c.id === id);
const itemName = o => S.products[o.p].name + (S.products[o.p].v.length <= 2 ? ' · ' + S.products[o.p].v : '');
const drafts = () => S.convos.filter(c => c.draft && !c.draft.kept).length;
const count = st => S.orders.filter(o => o.status === st).length;
const nextTime = c => { const last = (c.msgs.at(-1) || {}).at || '10:00'; const m = /^(\d{1,2}):(\d{2})$/.exec(last); if (!m) return last; let t = (+m[1]) * 60 + (+m[2]) + 1; t %= 1440; return String(Math.floor(t / 60)).padStart(2,'0') + ':' + String(t % 60).padStart(2,'0'); };

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 2800);
}

function nav(){
  const items = [['inbox','Inbox',drafts()],['orders','Orders',0],['stock','Stock',0],['helper','Helper view',0]];

    <div class="brand">${ICON.logo}Kept</div>

    <div class="grow"></div>
    <div class="profile"><span class="avatar on">P</span><div><div style="font-weight:600">Priya</div><div class="small">Owner</div></div></div>
  </nav>`;
}

function saleBar(extra){
  if (!S.sale) return '';
  return `<div class="sale" role="status">Sale mode on<span>${extra}</span></div>`;
}

function text(parts){
  return parts.map(p => typeof p === 'string' ? esc(p) : `<span class="hl-${p.h}">${esc(p.t)}</span>`).join('');
}

function viewInbox(){

function draftCard(c){
  const d = c.draft, key = d.pre + d.size, a = avail(key);
  if (d.kept){
    const o = order(d.orderId);
    return orderCard(o, c);
  }
  const soldOut = a < d.qty;
  const checks = (d.sizeCheck?1:0) + (d.addrCheck?1:0);
  const sizes = ['S','M','L'].map(s => `<button type="button" data-act="size" data-s="${s}" aria-pressed="${d.size===s}">${s}</button>`).join('');

  if (soldOut) sizeRow = `<div class="f bad"><span class="k">Size</span><div class="v"><div class="sizes" role="group" aria-label="Size">${sizes}</div>

      <button type="button" class="btn secondary sm" data-act="offer">Offer another size</button></div></div>`;
  else if (d.sizeCheck) sizeRow = `<div class="f check"><span class="k">Size</span><div class="v"><div class="sizes" role="group" aria-label="Size">${sizes}</div>

  else sizeRow = `<div class="f"><span class="k">Size</span><div class="v"><div class="sizes" role="group" aria-label="Size">${sizes}</div></div></div>`;
  const addrRow = d.addrCheck
    ? `<div class="f check"><span class="k">Address</span><div class="v"><span class="addr">${esc(d.addr)}</span><span class="hint">No house or flat number</span>
        <button type="button" class="btn secondary sm" data-act="askPin">Request location pin</button></div></div>`
    : `<div class="f"><span class="k">Address</span><div class="v"><span class="addr">${esc(d.addr)}</span></div></div>`;
  const stockChip = soldOut ? '<span class="chip unpaid">Sold out</span>'
    : `<span class="chip ${a - d.qty <= 0 ? 'check' : 'paid'}">In stock · ${a - d.qty} left after this</span>`;
  const foot = d.confirm
    ? `<div class="confirm"><strong>${checks} ${checks===1?'check is':'checks are'} still open.</strong><span class="small">You can approve now and fix it later, or resolve it first.</span>
        <div class="row" style="display:flex;flex-wrap:wrap;gap:8px"><button type="button" class="btn primary sm" data-act="approve" data-force="1">Approve anyway</button><button type="button" class="btn quiet sm" data-act="cancelConfirm">Go back</button></div></div>`
    : `${checks?`<span class="hint" style="font-weight:600">${checks} ${checks===1?'thing':'things'} to check</span>`:'<span class="small">Everything looks complete.</span>'}
       <div class="row"><button type="button" class="btn primary" data-act="approve" ${soldOut?'disabled':''}>${soldOut?'Pick an available size':'Approve order'}</button>
       <button type="button" class="btn quiet" data-act="discard">Discard</button></div>`;
  return `<article class="card draft">
    <div class="top"><h2>Draft order</h2><span class="chip ai">Drafted by AI</span></div>
    <p class="small" style="margin:0 0 8px">Check each field, then approve. Nothing is sent to ${esc(c.who.split(' ')[0])}.</p>
    <div class="f"><span class="k">Customer</span><div class="v"><strong>${esc(c.who)}</strong></div></div>
    ${addrRow}
    <div class="f"><span class="k">Item</span><div class="v">${esc(d.product)}</div></div>
    ${sizeRow}
    <div class="f"><span class="k">Quantity</span><div class="v">${d.qty}</div></div>

    <div class="pay no"><span class="big">Not paid yet</span><small>You'll mark it Paid after checking your bank.</small></div>
    <div class="foot">${foot}</div>
  </article>`;
}

function orderCard(o, c){
  const idx = {unpaid:0, paid:1, packed:2, delivered:3}[o.status];

  const addrRow = o.addr ? `<div class="f"><span class="k">Address</span><div class="v"><span class="ok">Complete</span></div></div>`

function render(){
  const v = {inbox:viewInbox, orders:viewOrders, stock:viewStock, helper:viewHelper}[S.view]();
  document.getElementById('app').innerHTML = `<div class="app">${nav()}<main class="main">${v}</main></div>`;
  const m = document.getElementById('msgs'); if (m) m.scrollTop = m.scrollHeight;
}

function reply(c, text, after){
  S.typing = c.id; render();
  setTimeout(() => {
    S.typing = null;
    c.msgs.push({f:'b', t:[text], at:nextTime(c)});
    c.time = 'now';
    after && after();
    render();
  }, 1200);
}

function send(){
  const c = convo(S.sel), input = document.getElementById('reply');
  const val = (input ? input.value : '').trim();
  if (!val) return;
  c.msgs.push({f:'s', t:[val], at:nextTime(c)});
  S.compose[c.id] = '';
  const p = c.pending; c.pending = null;
  render();
  if (p === 'size') reply(c, 'M please!', () => { c.draft.size = 'M'; c.draft.sizeCheck = false; toast('Size confirmed: M'); });
  else if (p === 'offer'){ const alt = c.draft.alt; reply(c, `Oh no! Yes, ${alt} works`, () => { c.draft.size = alt; c.draft.sizeCheck = false; toast(`Draft updated to size ${alt}`); }); }
  else if (p === 'pin'){ const pin = {riya:'12 Lake View Road, Flat 4B', farah:'27 Rose Lane, Unit 5'}[c.id] || 'my saved address, Unit 2'; reply(c, 'Location pin: ' + pin, () => {
    if (c.draft && !c.draft.kept){ c.draft.addr = pin; c.draft.addrCheck = false; }
    const o = c.order ? order(c.order) : c.draft && c.draft.orderId ? order(c.draft.orderId) : null;
    if (o) o.addr = true;
    toast('Address updated from the location pin');
  }); }
}

function prefill(text, pending){
  const c = convo(S.sel);
  S.compose[c.id] = text; c.pending = pending;
  render();
  const i = document.getElementById('reply'); if (i){ i.focus(); i.setSelectionRange(i.value.length, i.value.length); }
  toast('Saved reply added. Review it, then Send.');
}

document.addEventListener('input', e => { if (e.target.id === 'reply') S.compose[S.sel] = e.target.value; });
document.addEventListener('submit', e => { if (e.target.dataset.form === 'send'){ e.preventDefault(); send(); } });
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act, c = convo(S.sel), id = +b.dataset.id;
  if (a === 'reset'){ S = fresh(); render(); toast('Demo reset'); return; }
  if (a === 'view'){ S.view = b.dataset.v; render(); window.scrollTo(0,0); return; }
  if (a === 'sel'){ S.sel = b.dataset.id; render(); if (innerWidth <= 860){ const ch = document.querySelector('.chat'); if (ch) ch.scrollIntoView({behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block:'start'}); } return; }
  if (a === 'tip'){ S.tip = false; render(); return; }
  if (a === 'sale'){ S.sale = !S.sale; render(); toast(S.sale ? 'Sale mode on' : 'Sale mode off'); return; }
  if (a === 'mode'){ S.stockMode = b.dataset.m; render(); return; }
  if (a === 'size'){ c.draft.size = b.dataset.s; c.draft.sizeCheck = false; c.draft.confirm = false; render(); return; }
  if (a === 'askSize'){ prefill('Just to confirm, would you like M or L?', 'size'); return; }
  if (a === 'offer'){
    const alt = ['M','S','L'].find(z => z !== c.draft.size && avail(c.draft.pre + z) >= c.draft.qty);
    c.draft.alt = alt || null;
    prefill(alt ? `So sorry, ${c.draft.size} just sold out. ${alt} is available. Would that work?` : `So sorry, that one just sold out. I'll let you know when it's back.`, alt ? 'offer' : null);
    return;
  }
  if (a === 'askPin'){ prefill('Could you send your location pin so the courier can find you easily?', 'pin'); return; }
  if (a === 'cancelConfirm'){ c.draft.confirm = false; render(); return; }
  if (a === 'discard'){ c.draft = null; render(); toast('Draft discarded'); return; }
  if (a === 'approve'){
    const d = c.draft, open = (d.sizeCheck?1:0) + (d.addrCheck?1:0);
    if (open && !b.dataset.force){ d.confirm = true; render(); return; }
    const o = {id:S.nextId++, who:c.who, ch:c.ch, p:d.pre + d.size, qty:d.qty, status:'unpaid', addr:!d.addrCheck, conv:c.id, age:'just now'};
    S.orders.push(o); d.kept = true; d.orderId = o.id; d.confirm = false; S.newOrder = o.id;
    render(); toast(`Order #${o.id} kept. Added to Unpaid.`); return;
  }
  if (a === 'askPaid'){ S.confirmPay = id; render(); return; }
  if (a === 'cancelPay'){ S.confirmPay = null; render(); return; }
  if (a === 'paid'){ const o = order(id); o.status = 'paid'; S.products[o.p].stock -= o.qty; S.confirmPay = null; render(); toast(`#${id} marked paid. It's on Arjun's pick list.`); return; }
  if (a === 'pack'){ const o = order(id); o.status = 'packed'; render(); toast(`#${id} packed. The board updated.`); return; }
  if (a === 'deliver'){ const o = order(id); o.status = 'delivered'; render(); toast(`#${id} delivered`); return; }
});
render();
</script>
<script>(function(){var h=location.hash&&document.getElementById(location.hash.slice(1));try{(h||document.body).scrollIntoView({block:"start"});}catch(e){}})();</script>
</body>
</html>
